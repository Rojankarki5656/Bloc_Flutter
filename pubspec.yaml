name: animeweebs
description: Watch anime online for free
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.6
  get_it: ^7.6.7
  equatable: ^2.0.5
  
  # Navigation
  go_router: ^13.2.4
  
  # Networking
  dio: ^5.4.3+1
  retrofit: ^4.1.0
  json_annotation: ^4.9.0
  
  # Local Storage
  shared_preferences: ^2.2.3
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  
  # UI
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  lottie: ^3.0.0
  
  # Utilities
  logger: ^2.0.2+1
  connectivity_plus: ^6.0.2
  url_launcher: ^6.3.0
  intl: ^0.19.0
  webview_flutter: ^4.7.0
  
  # Testing
  flutter_test:
    sdk: flutter
  carousel_slider: ^5.1.2

dev_dependencies:
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  analyzer: ^6.4.1  # Add this line
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true